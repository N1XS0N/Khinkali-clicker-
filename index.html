<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khinkali clicker</title>
  <link rel="shortcut icon" href="Khinkali.png" type="image/x-icon">
</head>

<body>
  <div class="div1">
    <p id="title">Khinkali clicker</p>
  </div>
  <div class="div1">
    <p id="Record">Previos score:</p>
  </div>
  <div class="div1">
    <p id="Count">0</p>
  </div>
  <div class="div1">
    <p id="PlusC">+1</p>
  </div>
  <div class="div1">
    <img src="Khinkali.png">
  </div>
  <br>
  <br>
  <div class="div3">
    <div class="div2">
      <input type="text" placeholder="Enter Cheat codes!" for="btn">
      <button onclick="Cheat()" name="btn">Enter</button>
    </div>
  </div>
  <div class="div1">
    <p id="idX">Created by : N.K (N1XS0N) </p>
  </div>
  <script>
    const Rec = document.querySelector("#Record")
    const DOCT = document.querySelector("title")
    const body = document.querySelector("body")
    const title = document.querySelector("#title")
    const Logo = document.querySelector("link")
    const input = document.querySelector("input")
    const btn = document.querySelector("button")
    const num = document.querySelector("#Count")
    let boom = false
    let clicks = 0
    let clicks1 = 2
    const img = document.querySelector("img")
    const p2 = document.querySelector("#PlusC")
    window.onbeforeunload = function (e) {
      let local_rec = localStorage.setItem("Prescore", 0)
      local_rec = localStorage.setItem("Prescore", clicks)
      e.preventDefault()
    }
    img.addEventListener("click", function () {
      let Record2 = localStorage.getItem("Prescore")
      if (Record2 == null) { Rec.innerHTML = `Previos score:0` }
      else {
        Rec.innerHTML = `Previos record:${Record2}`
      }
      clicks += 1
      if (clicks >= clicks1 / 2) {
        clicks += clicks1 / 2
        clicks1 += 2
        num.innerHTML = `${clicks}`
        p2.innerHTML = `+${clicks1 / 2}`
      }
      if (img.classList != "p" && !boom == true) {
        img.classList.add("p")
      }
      setTimeout(function () { img.classList.remove("p") }, 100)
      if (p2.classList != "plus") {
        p2.classList.add("plus")
      }
      setTimeout(function () {
        p2.classList.remove('plus')
      }, 300)
      if (img.classList != "boom" && boom == true) {
        img.classList.add("boom")
        setTimeout(function () {
          body.style.display = "none"
          setTimeout(function () { window.location.reload() }, 300)
        }, 3000)
      }
    })
    function Cheat() {
      let string = input.value
      string = string.trim()
      string = string.toUpperCase()
      switch (string) {
        case "KHINKALIEATER":
          clicks = clicks + 100
          clicks1 = clicks1 + 102
          input.value = ""
          break;
        case "KHACHAPURI":
          title.style.fontSize = "30px"
          img.src = "Khachapuri.png"
          Logo.href = "Khachapuri.png"
          img.style.width = "100px"
          img.style.height = "100px"
          p2.style.fontSize = "15px"
          title.innerHTML = "Khachapuri clicker"
          DOCT.innerHTML = "Khachapuri clicker"
          input.value = ""
          break;
        case "HACKER":
          clicks += 250
          clicks1 += 252
          input.value = ""
          break;
        case "KHINKALI":
          img.src = "Khinkali.png"
          Logo.href = "Khinkali.png"
          title.style.fontSize = "40px"
          DOCT.innerHTML = "Khinkali clicker"
          img.style.width = "150px"
          img.style.height = "150px"
          p2.style.fontSize = "25px"
          title.innerHTML = "Khinkali clicker"
          input.value = ""
          break
        case "NIXSONGANG":
          clicks += 200
          clicks1 += 202
          input.value = ""
          break;
        case "ZERO":
          clicks = 0
          clicks1 = 2
          input.value = ""
          break;
        case "GVEZELI":
          img.src = "Gvezeli.png"
          title.style.fontSize = "30px"
          img.style.width = "200px"
          img.style.height = "200px"
          p2.style.fontSize = "25px"
          title.innerHTML = "Gvezeli clicker"
          DOCT.innerHTML = "Gvezeli clicker"
          Logo.href = "Gvezeli.png"
          input.value = ""
          break;
        case "PIZZA":
          img.src = "Pizza.png"
          title.style.fontSize = "40px"
          img.style.width = "200px"
          img.style.height = "200px"
          p2.style.fontSize = "25px"
          title.innerHTML = "Pizza clicker"
          DOCT.innerHTML = "Pizza clicker"
          Logo.href = "Pizza.png"
          input.value = ""
          break;
        case "HAMBURGER":
          img.src = "HamB.png"
          title.style.fontSize = "30px"
          img.style.width = "200px"
          img.style.height = "200px"
          p2.style.fontSize = "25px"
          title.innerHTML = "Hamburger clicker"
          DOCT.innerHTML = "Hamburger clicker"
          Logo.href = "HamB.png"
          input.value = ""
          break;
        case "PILMENI":
          img.src = "PILMENI.png"
          title.style.fontSize = "30px"
          img.style.width = "150px"
          img.style.height = "150px"
          p2.style.fontSize = "25px"
          title.innerHTML = "Pilmeni clicker"
          DOCT.innerHTML = "Pilmeni clicker"
          Logo.href = "PILMENI.png"
          input.value = ""
          break;
        case "LIST":
          alert("1.KHINKALIEATER 2.KHACHAPURI 3.HACKER 4.NIXSONGANG 5.ZERO 6.GVEZELI 7.LIST 8.PILMENI 9.PIZZA 10.HAMBURGER 11.KHINKALI 12.KHARCHO 13.GHOMI 14.VALERI")
          input.value = ""
          break;
        case "KHARCHO":
          img.src = "kharcho.png"
          title.style.fontSize = "40px"
          img.style.width = "250px"
          img.style.height = "190px"
          p2.style.fontSize = "25px"
          DOCT.innerHTML = "Kharcho clicker"
          title.innerHTML = "Kharcho clicker"
          Logo.href = "Kharcho.png"
          input.value = ""
          break;
        case "GHOMI":
          img.src = "Ghomi.png"
          title.style.fontSize = "40px"
          img.style.width = "200px"
          img.style.height = "200px"
          p2.style.fontSize = "25px"
          title.innerHTML = "Ghomi clicker"
          DOCT.innerHTML = "Ghomi clicker"
          Logo.href = "Ghomi.png"
          input.value = ""
          break;
        case "VALERI":
          img.src = "Rachuli.png"
          title.style.fontSize = "40px"
          img.style.width = "250px"
          img.style.height = "120px"
          p2.style.fontSize = "25px"
          title.innerHTML = "Lori clicker"
          DOCT.innerHTML = "Lori clicker"
          Logo.href = "Rachuli.png"
          input.value = ""
          break;
      }
    }
  </script>
  <style>
    #idX {
      font-size: 15px;
      opacity: 50%;
      font-family: monospace, 'Courier New', Courier;
    }

    img {
      width: 150px;
      height: 150px;
    }

    div {
      display: flex;
      justify-content: space-evenly;
    }

    body {
      font-weight: bold;
      font-family: Verdana, monospace, sans-serif;
      background-color: white;
    }

    button {
      font-size: 15px;
      border-radius: 7%;
      font-family: Verdana, monospace, sans-serif;
      border: 2px solid black;
      background-color: white;
    }

    input {
      font-size: 15px;
      border: 2px solid black;
      font-family: Verdana, monospace, sans-serif;
    }

    .p {
      animation: p 100ms ease-in-out;
    }

    @keyframes p {
      0% {}

      50% {
        scale: 1.2
      }

      100% {
        scale: 1
      }

    }

    h1 {
      font-size: 15px;


    }

    .plus {
      animation: plus 300ms ease-in-out;
    }

    @keyframes plus {
      0% {}

      50% {
        scale: 1.2;
        opacity: 100%;

      }

      100% {
        scale: 1;
        opacity: 0%;
      }
    }

    #PlusC {
      font-size: 25px;
      opacity: 0%;
    }

    #title {
      font-size: 40px;
      ;
    }

    #Count {
      font-size: 35px;
    }

    .div1 {
      display: flex;
      align-items: center;
    }

    .div3 {
      display: flex;
      width: 100%;
      align-items: center;
    }

    .div2 {
      display: flex;
      justify-items: center;
    }

    #Record {
      font-size: 20px;
    }
  </style>
</body>

</html>
