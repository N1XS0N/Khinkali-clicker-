<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khinkali clicker!</title>
</head>

<body>
  <div class="div1">
    <p id="title">Khinkali clicker !</p>
  </div>
  <div class="div1">
    <p id="Count">0</p>
  </div>
  <div class="div1">
    <p id="PlusC">+1</p>
  </div>
  <div class="div1">
    <img src="Khinkali.png">
  </div>
  <br>
  <br>
  <div class="div3">
    <div class="div2">
      <input type="text" placeholder="Enter Cheat codes!" for="btn">
      <button onclick="Cheat()" name="btn">Enter</button>
    </div>
  </div>
  <div class="div1">
    <p id="idX">Created by : N.K (N1XS0N) </p>
  </div>
  <audio id="myAudio" src="Tap.wav"></audio>
  <script>
    const audio = document.querySelector("#myAudio")
    const title = document.querySelector("#title")
    const input = document.querySelector("input")
    const btn = document.querySelector("button")
    const num = document.querySelector("#Count")
    let clicks = 0
    let clicks1 = 2
    const img = document.querySelector("img")
    const p2 = document.querySelector("#PlusC")
    img.addEventListener("click", function () {
      clicks += 1
      audio.play()
      if (clicks >= clicks1 / 2) {
        clicks += clicks1 / 2
        clicks1 += 2
        num.innerHTML = `${clicks}`
        p2.innerHTML = `+${clicks1 / 2}`
      }
      if (img.classList != "p") {
        img.classList.add("p")
      }
      setTimeout(function () { img.classList.remove("p") }, 100)
      if (p2.classList != "plus") {
        p2.classList.add("plus")
      }
      setTimeout(function () {
        p2.classList.remove('plus')
      }, 300)

    })
    function Cheat() {
      let string = input.value
      string = string.trim()
      string = string.toUpperCase()
      switch (string) {
        case "KHINKALI3030":
          clicks = clicks + 100
          clicks1 = clicks1 + 102
          input.value = ""
          break;
        case "KHACHAPURI":
          img.src = "Khachapuri.png"
          img.style.width = "100px"
          img.style.height = "100px"
          p2.style.fontSize = "15px"
          title.innerHTML = "KHACHAPURI CLICKER!"
          input.value = ""
          break;
        case "HACKER":
          clicks += 1000
          clicks1 += 1002
          input.value = ""
          break;
        case "NIXSONGANG":
          clicks += 200
          clicks1 += 202
          input.value = ""
          break;
        case "ZERO":
          clicks = 0
          clicks1 = 2
          input.value = ""
          break;
        case "GVEZELI":
          img.src = "Gvezeli.png"
          img.style.width = "200px"
          img.style.height = "200px"
          p2.style.fontSize = "25px"
          title.innerHTML = "GVEZELI CLICKER!"
          input.value = ""
          break;
        case "PILMENI":
          img.src = "PILMENI.png"
          img.style.width = "200px"
          img.style.height = "200px"
          p2.style.fontSize = "25px"
          title.innerHTML = "PILMENI CLICKER!"
          input.value = ""
          break;
        case "CHEATLIST64":
          alert("1.KHINKALI3030 2.KHACHAPURI 3.HACKER 4.NIXSONGANG 5.ZERO 6.GVEZELI 7. CHEATLIST64 8.PILMENI 9.RESET 10.RECIPE")
          input.value = ""
          break;
        case "RESET":
          img.src = "Khinkali.png"
          p2.style.fontSize = "25px"
          input.value = ""
        case "RECIPE":
          window.open('https://www.travelcookrepeat.com/khinkali-georgian-dumplings/', '_blank');

      }
    }
  </script>
  <style>
    #idX {
      font-size: 20px;
      opacity: 50%;
      font-family: monospace;
    }

    img {
      width: 150px;
      height: 150px;
    }

    div {
      display: flex;
      justify-content: space-evenly;
    }

    body {
      font-weight: bold;
      font-family: Verdana;
      background-color: white;
    }

    button {
      font-size: 15px;
      border-radius: 7%;
      font-family: Verdana;
      border: 2px solid black;
      background-color: white;
    }

    input {
      font-size: 15px;
      border: 2px solid black;
      font-family: Verdana;
    }

    .p {
      animation: p 100ms ease-in-out;
    }

    @keyframes p {
      0% {}

      50% {
        scale: 1.2
      }

      100% {
        scale: 1
      }

    }

    h1 {
      font-size: 15px;


    }

    .plus {
      animation: plus 300ms ease-in-out;
    }

    @keyframes plus {
      0% {}

      50% {
        scale: 1.2;
        opacity: 100%;

      }

      100% {
        scale: 1;
        opacity: 0%;
      }
    }

    #PlusC {
      font-size: 25px;
      opacity: 0%;
    }

    #title {
      font-size: 45px;
      ;
    }

    #Count {
      font-size: 40px;
    }

    .div1 {
      display: flex;
      align-items: center;
    }

    .div3 {
      display: flex;
      width: 100%;
      align-items: center;
    }

    .div2 {
      display: flex;
      justify-items: center;
    }
  </style>
</body>

</html>
